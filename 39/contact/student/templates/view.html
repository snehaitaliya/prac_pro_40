<!DOCTYPE html>
<html>
<head>
    <title>View Contacts</title>
</head>

<body>

<h1>Contact List</h1>

<table border="1" cellpadding="10" cellspacing="0">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Address</th>
        <th>Action</th>
    </tr>

    {% for contact in contacts %}

    <tr>
        <td>{{ contact.id }}</td>
        <td>{{ contact.name }}</td>
        <td>{{ contact.phone }}</td>
        <td>{{ contact.email }}</td>
        <td>{{ contact.address }}</td>

        <td>
            <a href="{% url 'delete_contact' contact.id %}">
                Delete
            </a>
        </td>
    </tr>

    {% empty %}

    <tr>
        <td colspan="6">No Contact Found</td>
    </tr>

    {% endfor %}

</table>

<br>

<a href="{% url 'home' %}">Add New Contact</a>

</body>
</html>
